<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=400">
  <title>Steam PricePerHour — Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup__header">
      <div class="popup__header-row">
        <div class="popup__brand">
          <img class="popup__icon" src="image.png" alt="" width="26" height="26">
          <div class="popup__brand-text">
            <h1 class="popup__title" data-i18n="title">Steam PricePerHour</h1>
            <p class="popup__subtitle" data-i18n="subtitle">Smart value insights for Steam</p>
          </div>
        </div>
        <span id="status-pill" class="popup__pill popup__pill--on" aria-live="polite">ON</span>
      </div>
    </header>

    <div class="popup__card popup__card--toggle">
      <button id="toggle-enabled" class="popup__toggle" type="button" role="switch" aria-checked="true" data-i18n-aria="toggle-aria">
        <span class="popup__toggle-track">
          <span class="popup__toggle-thumb"></span>
        </span>
        <span class="popup__toggle-body">
          <span class="popup__toggle-title" id="toggle-text" data-i18n="toggle-on">Calculation enabled</span>
          <span class="popup__toggle-hint" id="toggle-hint" data-i18n="toggle-on-hint">Cache + data updates</span>
        </span>
      </button>
    </div>

    <section class="popup__section">
      <h2 class="popup__section-title" data-i18n="section-value-mode">Value mode</h2>
      <div class="popup__radio-group" role="radiogroup" data-i18n-aria="aria-value-mode">
        <label class="popup__radio-card" for="mode-main">
          <input type="radio" name="value-mode" id="mode-main" value="main" checked>
          <span class="popup__radio-indicator"></span>
          <span class="popup__radio-body">
            <span class="popup__radio-title" data-i18n="mode-main-title">Story</span>
            <span class="popup__radio-desc" data-i18n="mode-main-desc">Main story</span>
          </span>
        </label>
        <label class="popup__radio-card" for="mode-plus">
          <input type="radio" name="value-mode" id="mode-plus" value="plus">
          <span class="popup__radio-indicator"></span>
          <span class="popup__radio-body">
            <span class="popup__radio-title" data-i18n="mode-plus-title">Story + Extras</span>
            <span class="popup__radio-desc" data-i18n="mode-plus-desc">Story + additional content</span>
          </span>
        </label>
        <label class="popup__radio-card" for="mode-completionist">
          <input type="radio" name="value-mode" id="mode-completionist" value="completionist">
          <span class="popup__radio-indicator"></span>
          <span class="popup__radio-body">
            <span class="popup__radio-title">100%</span>
            <span class="popup__radio-desc" data-i18n="mode-completionist-desc">Full completion</span>
          </span>
        </label>
      </div>
    </section>

    <section class="popup__section">
      <h2 class="popup__section-title" data-i18n="section-acceptable-price">Acceptable price</h2>
      <div class="popup__field">
        <label class="popup__label popup__label--block" for="input-acceptable" data-i18n="price-label">Price per hour (Steam currency)</label>
        <input type="number" id="input-acceptable" class="popup__input" min="0" max="1000000" value="20" inputmode="decimal" placeholder="e.g. 20" aria-describedby="price-scale-desc">
        <div class="popup__scale" aria-hidden="true">
          <div class="popup__scale-bar">
            <div class="popup__scale-zone popup__scale-zone--green"></div>
            <div class="popup__scale-zone popup__scale-zone--yellow"></div>
            <div class="popup__scale-zone popup__scale-zone--red"></div>
          </div>
          <div class="popup__scale-labels">
            <span data-i18n="scale-below">−20%</span>
            <span data-i18n="scale-acceptable">±20%</span>
            <span data-i18n="scale-above">+20%</span>
          </div>
        </div>
        <span class="popup__field-hint" id="price-scale-desc" data-i18n="price-hint">Green = good price, yellow = average, red = high</span>
      </div>
    </section>

    <section class="popup__section">
      <h2 class="popup__section-title" data-i18n="section-display">Display</h2>
      <div class="popup__field">
        <label class="popup__label popup__label--block" for="select-language" data-i18n="language-label">Language</label>
        <select id="select-language" class="popup__select">
          <option value="ru">Русский</option>
          <option value="en" selected>English</option>
        </select>
      </div>
    </section>

    <div class="popup__buttons">
      <button id="btn-cache" class="popup__btn popup__btn--secondary" type="button" data-i18n="btn-cache">Clear cache</button>
    </div>

    <div id="popup-status" class="popup__status" aria-live="polite"></div>

    <footer class="popup__footer">
      <div class="popup__footer-info" data-i18n="footer-info">Settings apply immediately to open Steam pages.</div>
      <div class="popup__footer-author"><span data-i18n="footer-developed-by">Developed by</span> <a href="https://vintlgvard.com/" target="_blank" rel="noopener noreferrer">VintlGvard</a> · <a href="https://github.com/VintlGvard/steam_priceperhour" target="_blank" rel="noopener noreferrer">GitHub</a></div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
